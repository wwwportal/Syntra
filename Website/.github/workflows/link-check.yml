name: Site Checks

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize]

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for dead internal links
        run: python3 tools/check-links.py

      - name: Check every page shares the same shell
        if: always()
        run: python3 tools/check-pages.py
